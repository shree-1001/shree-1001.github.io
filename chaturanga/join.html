<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join a Chaturanga Match</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ivory: #F6EFDD;
    --ink: #241A12;
    --maroon: #5C1A1B;
    --maroon-deep: #2E0C0D;
    --gold: #C9A227;
    --gold-bright: #E8C468;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: linear-gradient(160deg, var(--maroon-deep), var(--maroon));
    color: var(--ivory);
    font-family: 'Source Sans 3', sans-serif;
    text-align: center;
  }
  .card {
    max-width: 420px;
    width: 100%;
  }
  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2.1rem;
    margin: 0 0 8px;
  }
  p.sub { color: rgba(246,239,221,0.75); margin: 0 0 32px; }
  .code-box {
    background: rgba(246,239,221,0.08);
    border: 1px solid rgba(232,196,104,0.35);
    border-radius: 14px;
    padding: 24px;
    margin-bottom: 28px;
  }
  .code-label {
    font-size: 0.78rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(246,239,221,0.55);
    margin-bottom: 8px;
  }
  #code {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 700;
    font-size: 2.6rem;
    letter-spacing: 0.14em;
    color: var(--gold-bright);
  }
  .btn {
    display: inline-block;
    width: 100%;
    background: linear-gradient(135deg, var(--gold-bright), var(--gold));
    color: var(--maroon-deep);
    font-weight: 700;
    padding: 16px;
    border-radius: 999px;
    text-decoration: none;
    margin-bottom: 12px;
  }
  .note { font-size: 0.85rem; color: rgba(246,239,221,0.55); margin-top: 20px; }
</style>
</head>
<body>
  <div class="card">
    <h1>You've Been Challenged \u265A</h1>
    <p class="sub">A friend invited you to a match in Chaturanga: Legacy of Kings.</p>

    <div class="code-box">
      <div class="code-label">Your Room Code</div>
      <div id="code">------</div>
    </div>

    <!-- TODO: replace with your real Play Store listing URL once live -->
    <a class="btn" href="#" id="get-app-link">Get Chaturanga</a>

    <p class="note">
      Already have the app? Open it, go to Play Online \u2192 Join a Room, and enter the code above.
    </p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    if (code) {
      document.getElementById('code').textContent = code.toUpperCase();
    }
    // TODO: once live on Play Store, point this at your real listing, e.g.:
    // document.getElementById('get-app-link').href =
    //   "https://play.google.com/store/apps/details?id=com.shree.chaturanga";
  </script>
</body>
</html>
